# @package _global_
defaults:
  - override /model: best
  - override /trainer: best
  - override /hydra/job_logging: colorlog
  - override /hydra/hydra_logging: colorlog

experiment: ablation-moco-best
base_path: /home/jacopo/PycharmProjects/progetto-tesi/
teacher_weights_path: ${base_path}main/dependencies/VATE/best_model_contrastive.pt

trainer:
  use_moco: False


seed: 42

dataset_descriptors:
  - dataset_path: "/home/jacopo/dataset/EEGAVI/AMIGOS/combined-compressed/"
    cache_path: null
    dataset_weight: 137
  - dataset_path: "/home/jacopo/dataset/EEGAVI/DEAP/combined-compressed/"
    cache_path: null
    dataset_weight: 101
  - dataset_path: "/home/jacopo/dataset/EEGAVI/MAHNOB/combined-compressed/"
    cache_path: null
    dataset_weight: 30
  - dataset_path: "/home/jacopo/dataset/EEGAVI/EAV/combined-compressed/"
    cache_path: null
    dataset_weight: 227



hydra:
  job:
    name: ${experiment}
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}

  job_logging:
    root:
      handlers: [ console, file ]   # make sure both are used

    handlers:
      file:
        class: logging.FileHandler
        formatter: simple         # or "colorlog" if you really want ANSI codes in file
        filename: ${hydra.runtime.output_dir}/job.log