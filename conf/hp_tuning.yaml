base_path: /mnt/datasets/
defaults:
  - hydra-setup
  - model: default
  - trainer: default
  - teacher: default
  - search_space: default

hydra:
  job:
    name: hp_tuning

  run:
    dir: outputs/${hydra.job.name}/${dataset.name}/${now:%Y-%m-%d_%H-%M-%S}

dataset_descriptors:
  - dataset_path: "/mnt/datasets/EEGAVI/AMIGOS/combined/"
    cache_path: null
    dataset_weight: 137 # Power Law
  - dataset_path: "/mnt/datasets/EEGAVI/DEAP/combined-compressed/"
    cache_path: null
    dataset_weight: 101 # Power Law
  - dataset_path: "/mnt/datasets/EEGAVI/MAHNOB/combined-compressed/"
    cache_path: null
    dataset_weight: 28 # Power Law
  - dataset_path: "/mnt/datasets/EEGAVI/EAV/combined-compressed/"
    cache_path: null
    dataset_weight: 227


dataset:
  eeg_config:
    model_weights_path: /root/PycharmProjects/progetto-tesi/main/dependencies/cbramod/pretrained_weights.pth