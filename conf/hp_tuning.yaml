base_path: /mnt/datasets/
defaults:
  - hydra-setup
  - model: default
  - trainer: default
  - teacher: default
  - search_space: default

hydra:
  job:
    name: hp_tuning

  run:
    dir: outputs/${hydra.job.name}/${dataset.name}/${now:%Y-%m-%d_%H-%M-%S}

dataset:
  eeg_config:
    model_weights_path: /root/PycharmProjects/progetto-tesi/main/dependencies/cbramod/pretrained_weights.pth