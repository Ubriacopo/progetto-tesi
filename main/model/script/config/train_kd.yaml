base_path: /home/jacopo/PycharmProjects/progetto-tesi/
use_base_path: True
batch_size: 12
teacher_weights_path: main/dependencies/VATE/best_model_contrastive.pt
student_dataset_path: [
  "data/EEGAVI/AMIGOS/interleaved/spec.csv",
  "data/EEGAVI/EAV/interleaved/spec.csv"
  # "data/deap/p-interleaved-d/spec.csv"
]
teacher_dataset_path: [
  "data/EEGAVI/AMIGOS/vate/spec.csv",
  "data/EEGAVI/EAV/vate/spec.csv"
]
# Training infos
lr: 1e-3
kd_loss_weight: 1.0
fusion_loss_weight: 1.0
weakly_supervised_weight: 0.5
ecg_correction_weight: 0.2
kd_temperature: 0.2
epochs: 10


hydra:
  job_logging:
    root:
      handlers: [ console, file ]   # make sure both are used

    handlers:
      file:
        class: logging.FileHandler
        formatter: simple         # or "colorlog" if you really want ANSI codes in file
        filename: ${hydra.runtime.output_dir}/job.log