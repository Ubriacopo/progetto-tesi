defaults:
  - model: default
  - trainer: default
  - teacher: default

base_path: /home/jacopo/PycharmProjects/progetto-tesi/
teacher_weights_path: ${base_path}main/dependencies/VATE/best_model_contrastive.pt


student_dataset_path:
  - dataset_spec_file: "/${base_path}data/EEGAVI/EAV/interleaved-quantized/spec.csv"
    cache_path: null

teacher_dataset_path:
  - dataset_spec_file: "/${base_path}data/EEGAVI/EAV/vate-quantized/spec.csv"
