defaults:
  - model: default
  - trainer: default
  - teacher: default

base_path: /home/jacopo/PycharmProjects/progetto-tesi/
teacher_weights_path: ${base_path}main/dependencies/VATE/best_model_contrastive.pt


dataset_descriptors:
  - dataset_path: "/${base_path}data/EEGAVI/MAHNOB/combined/"
    cache_path: null
