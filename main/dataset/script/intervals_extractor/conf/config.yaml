# Where things are fetched from
base_path: /mnt/turing-datasets
defaults:
  - dataset: amigos
  - segmenter: eeg_features_segmenter

uid_store_path: ${.base_path}/EEGAVI/uid_store.csv

hydra:
  job_logging:
    root:
      handlers: [ console, file ]   # make sure both are used

    handlers:
      file:
        class: logging.FileHandler
        formatter: simple         # or "colorlog" if you really want ANSI codes in file
        filename: ${hydra.runtime.output_dir}/job.log