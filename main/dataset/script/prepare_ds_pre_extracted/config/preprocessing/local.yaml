# @package preprocessing
dataset_name: ???
out_folder_name: ???

DatasetName: "${capitalize:${.dataset_name}}"
DATASETNAME: "${uppercase:${.dataset_name}}"

config_classpath: main.dataset.${.dataset_name}.config.${.DatasetName}Config
loader_classpath: main.dataset.${.dataset_name}.loader.${.DatasetName}PointsLoader

base_path: /mnt/turing-datasets/
# Where the dataset is placed
data_path: ${.base_path}${.DATASETNAME}/
# Where extracted intervals are placed
