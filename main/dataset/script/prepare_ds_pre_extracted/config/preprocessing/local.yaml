# Objects have to be defined
uid_store_path: ${.base_path}/EEGAVI/uid_store.csv

output_max_length: 32
vid_config:
  max_frames: 32

aud_config:
  fs: 16000

eeg_config:
  fs: 200
  model_weights_path: /root/PycharmProjects/progetto-tesi/main/dependencies/cbramod/pretrained_weights.pth

txt_config:
  # TODO Problema
  extracted_base_path: ${..base_path}/data/amigos/extraction_data/

ecg_config:
  fs: 128
  fm_endpoint: localhost:7860/extract_features
