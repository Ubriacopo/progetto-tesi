config_classpath: main.dataset.${.name}.config.${.DatasetName}Config
loader_classpath: main.dataset.${.name}.loader.${.DatasetName}PointsLoader
data_path: ${base_path}${.DATASETNAME}/
extraction_data_folder: ${base_path}EEGAVI/${.DATASETNAME}/extraction-data/
