eeg_config:
  fs: 200
  model_weights_path: ???

txt_config:
  # TODO Problema
  extracted_base_path: ${base_path}/data/${..name}/extraction_data/

ecg_config:
  fs: 128
  fm_endpoint: localhost:7860/extract_features
